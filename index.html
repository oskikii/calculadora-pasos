<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Calculadora</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="contenedor">

    <!-- PANTALLA CALCULADORA DE PASOS -->
    <div id="pantallaPasos">

        <h1>❤️ Calculadora de Pasos para mi AMORSITO ❤️</h1>

        <button class="botonPantalla" onclick="cambiarPantalla('comidas')">
            Ir a Calculadora de Comidas 🍓
        </button>

        <button id="botonModo" onclick="cambiarModo()">
            Cambiar a Distancia → Pasos
        </button>

        <div id="modoPasos">

            <p class="subtitulo">Objetivo diario: <strong>12.000 pasos</strong></p>

            <input type="number" id="pasos" placeholder="Introduce los pasos realizados">

            <button onclick="calcularPasos()">Calcular</button>

        </div>

        <div id="modoDistancia" style="display:none;">

            <p class="subtitulo">Introduce una distancia en kilómetros</p>

            <input type="number" id="distancia" placeholder="Distancia en km">

            <button onclick="calcularDistancia()">Calcular</button>

        </div>

        <div id="resultado"></div>

    </div>

    <!-- PANTALLA CALCULADORA DE COMIDAS -->

<!-- PANTALLA CALCULADORA DE COMIDAS -->
<div id="pantallaComidas" style="display:none;">

    <h1>🍓 Calculadora de Comidas 🍓</h1>

    <button class="botonPantalla" onclick="cambiarPantalla('pasos')">
        Volver a Calculadora de Pasos ❤️
    </button>

    <p class="subtitulo">Selecciona un alimento</p>

<select id="comida">
    <option value="arroz">Arroz blanco 🍚</option>
    <option value="patata">Patata 🥔</option>
    <option value="boniato">Boniato 🍠</option>
    <option value="macarrones">Macarrones 🍝</option>
    <option value="pollo">Pollo (plancha o hervido) 🍗</option>
</select>
    <p class="subtitulo">Peso de la comida en crudo (gramos)</p>

    <input
        type="number"
        id="pesoCrudo"
        placeholder="Ej. 100"
        min="0"
        step="any"
    >

    <button onclick="calcularComida()">Calcular peso cocinado</button>

    <div id="resultadoComida"></div>

</div>


<script>

const longitudPaso = 0.75;
const objetivo = 12000;

// CAMBIAR ENTRE PANTALLAS
function cambiarPantalla(pantalla){

    const pantallaPasos = document.getElementById("pantallaPasos");
    const pantallaComidas = document.getElementById("pantallaComidas");

    if(pantalla === "comidas"){
        pantallaPasos.style.display = "none";
        pantallaComidas.style.display = "block";
    } else {
        pantallaPasos.style.display = "block";
        pantallaComidas.style.display = "none";
    }

}

// CAMBIAR ENTRE MODOS DE PASOS Y DISTANCIA
function cambiarModo(){

    const pasos = document.getElementById("modoPasos");
    const distancia = document.getElementById("modoDistancia");
    const boton = document.getElementById("botonModo");

    document.getElementById("resultado").innerHTML = "";

    if(pasos.style.display !== "none"){
        pasos.style.display = "none";
        distancia.style.display = "block";
        boton.innerHTML = "Cambiar a Pasos → Distancia";
    } else {
        pasos.style.display = "block";
        distancia.style.display = "none";
        boton.innerHTML = "Cambiar a Distancia → Pasos";
    }
}

// CALCULAR PASOS RESTANTES
function calcularPasos(){

    let pasos = parseInt(document.getElementById("pasos").value);
    const resultado = document.getElementById("resultado");

    if(isNaN(pasos) || pasos < 0){
        resultado.innerHTML = "Introduce un número válido.";
        return;
    }

    if(pasos >= objetivo){

        resultado.innerHTML = `
            <p class="ok">🎉 ¡Pasos de hoy terminados! ¡Enhorabuena Amooor! 🐱🐱❤️</p>
            <p>Has recorrido aproximadamente <strong>${(pasos * longitudPaso / 1000).toFixed(2)} km</strong></p>
        `;
        return;
    }

    let restantes = objetivo - pasos;
    let metros = restantes * longitudPaso;
    let km = metros / 1000;

    resultado.innerHTML = `
        <p><strong>Pasos restantes:</strong> ${restantes}</p>
        <p><strong>Distancia restante:</strong> ${metros.toFixed(0)} m (${km.toFixed(2)} km)</p>
        <p><strong>Progreso:</strong> ${(pasos / objetivo * 100).toFixed(1)}%</p>
    `;
}

// CALCULAR PASOS A PARTIR DE DISTANCIA
function calcularDistancia(){

    let km = parseFloat(document.getElementById("distancia").value);
    const resultado = document.getElementById("resultado");

    if(isNaN(km) || km < 0){
        resultado.innerHTML = "Introduce una distancia válida.";
        return;
    }

    let pasos = Math.round((km * 1000) / longitudPaso);

    resultado.innerHTML = `
        <p>Para recorrer <strong>${km.toFixed(2)} km</strong> necesitas:</p>
        <h2>${pasos.toLocaleString('es-ES')} pasos</h2>
    `;
}


function calcularComida() {

    const comida = document.getElementById("comida").value;
    const pesoCrudo = parseFloat(
        document.getElementById("pesoCrudo").value
    );
    const resultado = document.getElementById("resultadoComida");

    if (isNaN(pesoCrudo) || pesoCrudo <= 0) {
        resultado.innerHTML =
            "<p>Introduce un peso en gramos mayor que cero.</p>";
        return;
    }

    // Rangos orientativos: factor mínimo y máximo
    const factores = {
        arroz:     { min: 2.5, max: 3.0 },
        patata:    { min: 0.9, max: 1.0 },
        boniato:   { min: 0.8, max: 1.0 },
        macarrones:{ min: 2.0, max: 2.5 },
        pollo:     { min: 0.70, max: 0.80 }
    };

    const nombres = {
        arroz: "Arroz blanco",
        patata: "Patata",
        boniato: "Boniato",
        macarrones: "Macarrones",
        pollo: "Pollo cocinado (plancha o hervido)"
    };

    const pesoMinimo = Math.round(pesoCrudo * factores[comida].min);
    const pesoMaximo = Math.round(pesoCrudo * factores[comida].max);

    resultado.innerHTML = `
        <p>Alimento: <strong>${nombres[comida]}</strong></p>
        <p>Peso en crudo: <strong>${pesoCrudo} g</strong></p>
        <p>Peso cocinado aproximado:</p>
        <h2 class="ok">${pesoMinimo} – ${pesoMaximo} g</h2>
    `;
}



</script>

</body>
</html>
